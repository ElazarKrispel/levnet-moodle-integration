name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/levnet-moodle-source/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test and build server
        working-directory: packages/levnet-moodle-source
        run: npm ci && npm test && npm run build && npm run build:windows
      - name: Test calendar app
        working-directory: apps/calendar-web
        run: npm test && npm run check
      - name: Build Windows installer
        shell: pwsh
        run: ./installer/windows/build-installer.ps1
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "artifacts/windows/Levnet-Moodle-Setup.exe" --generate-notes --title "Levnet & Moodle Integration ${{ github.ref_name }}"
